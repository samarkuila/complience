<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Regulatory Monitoring - Compliance Portal</title>
<style>
/* ---- Colour system. Approximation of the TVS Credit palette: replace these values with the official brand tokens. ---- */
:root{
  --brand:#0B3C8C; --brand-700:#082F6E; --brand-50:#EAF0FA; --brand-100:#D5E1F5;
  --accent:#D7263D; --accent-50:#FDECEE;                       /* red: used sparingly, for things that need attention */
  --ink:#1B2A41; --ink-2:#4A5A73; --ink-3:#7A889E;
  --line:#E3E8F0; --line-2:#EEF1F6; --bg:#F5F7FB; --panel:#FFFFFF;
  --ok:#1E8E5A; --ok-50:#E7F5EE; --warn:#B7791F; --warn-50:#FDF4E1; --bad:#C0392B; --bad-50:#FBEAE8;
  --r:12px; --r-sm:8px; --sh:0 1px 2px rgba(20,35,70,.05),0 6px 20px rgba(20,35,70,.05); --sh-lg:0 20px 60px rgba(15,30,65,.22);
}
*{box-sizing:border-box} html{-webkit-text-size-adjust:100%}
body{margin:0;font:14px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);display:flex;min-height:100vh}
a{color:var(--brand);text-decoration:none} a:hover{text-decoration:underline}
button{font:inherit;cursor:pointer} :focus-visible{outline:3px solid #7FA6E8;outline-offset:2px;border-radius:6px}
/* sidebar */
aside{width:236px;background:var(--brand-700);color:#fff;padding:22px 14px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;flex:none}
.brand{display:flex;gap:10px;align-items:center;padding:0 8px 22px}.logo{width:34px;height:34px;border-radius:9px;background:#fff;color:var(--brand);display:grid;place-items:center;font-weight:800;font-size:15px;letter-spacing:-.5px}
.brand b{display:block;font-size:15px;line-height:1.15}.brand span{font-size:11.5px;opacity:.7}
nav{display:flex;flex-direction:column;gap:2px}
nav button{display:flex;align-items:center;gap:10px;background:none;border:0;color:#C9D6F0;text-align:left;padding:10px 12px;border-radius:9px;font-weight:500}
nav button:hover{background:rgba(255,255,255,.08);color:#fff} nav button.on{background:rgba(255,255,255,.14);color:#fff;font-weight:600}
nav svg{width:18px;height:18px;flex:none;opacity:.9} nav .n{margin-left:auto;background:var(--accent);color:#fff;font-size:11px;font-weight:700;border-radius:10px;padding:1px 7px}
.side-note{margin-top:auto;font-size:11.5px;color:#9FB3DA;padding:12px 10px;border-top:1px solid rgba(255,255,255,.12);line-height:1.5}
/* layout */
.wrap{flex:1;min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;padding:16px 32px;background:var(--panel);border-bottom:1px solid var(--line)}
.top h1{font-size:19px;margin:0;font-weight:650;letter-spacing:-.2px}.top p{margin:0;color:var(--ink-3);font-size:12.5px}.grow{flex:1}
main{padding:26px 32px 60px;max-width:1280px;width:100%}
/* controls */
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:8px 14px;border-radius:var(--r-sm);font-weight:600;font-size:13px;transition:.15s}
.btn:hover{border-color:#C6D0E0;background:#FAFBFE}.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}.btn.pri:hover{background:var(--brand-700)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}.btn.ok:hover{filter:brightness(.93)}.btn.danger{color:var(--bad)}.btn.sm{padding:5px 10px;font-size:12.5px}.btn:disabled{opacity:.5;cursor:not-allowed}
input,select,textarea{font:inherit;width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:var(--r-sm);background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{border-color:var(--brand);outline:3px solid var(--brand-100)} textarea{resize:vertical;min-height:72px}
label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-2);margin:0 0 5px}.hint{font-size:12px;color:var(--ink-3);margin-top:4px}
/* cards, stats */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px;margin-bottom:22px}
.stat{padding:18px 20px;position:relative}.stat .lab{font-size:12.5px;color:var(--ink-3);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.stat .val{font-size:32px;font-weight:700;letter-spacing:-1px;margin:4px 0 2px;line-height:1.1}.stat .sub{font-size:12.5px;color:var(--ink-2)}
.stat .val small{font-size:15px;color:var(--ink-3);font-weight:600;letter-spacing:0}.stat.warn .val{color:var(--accent)}
.sec{display:flex;align-items:center;gap:10px;margin:0 0 12px}.sec h2{font-size:15px;margin:0;font-weight:650}.sec .grow{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:20px;font-size:12px;font-weight:600;background:var(--line-2);color:var(--ink-2);white-space:nowrap}
.pill.ok{background:var(--ok-50);color:var(--ok)}.pill.warn{background:var(--warn-50);color:var(--warn)}.pill.bad{background:var(--bad-50);color:var(--bad)}.pill.brand{background:var(--brand-50);color:var(--brand)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ink-3);display:inline-block}.dot.ok{background:var(--ok)}.dot.bad{background:var(--accent)}
/* tables / lists */
.tbl{width:100%;border-collapse:collapse}.tbl th{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);text-align:left;padding:11px 16px;background:#FAFBFD;border-bottom:1px solid var(--line);font-weight:650}
.tbl td{padding:13px 16px;border-bottom:1px solid var(--line-2);vertical-align:middle}.tbl tr:last-child td{border-bottom:0}.tbl tbody tr:hover{background:#FAFBFE}
.scroll{overflow-x:auto}.muted{color:var(--ink-3)}.sm{font-size:12.5px}.clip{max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{padding:44px 20px;text-align:center;color:var(--ink-3)}.empty b{display:block;color:var(--ink-2);font-size:15px;margin-bottom:4px}
.srcgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.src{padding:14px 16px;display:flex;gap:12px;align-items:flex-start}.src .dot{margin-top:6px}.src b{display:block}.src .err{font-size:12px;color:var(--bad);margin-top:3px;line-height:1.35}
/* filters */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.chip{border:1px solid var(--line);background:#fff;color:var(--ink-2);padding:7px 14px;border-radius:22px;font-weight:600;font-size:13px}
.chip .c{margin-left:6px;opacity:.65}.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}.chip.on .c{opacity:.85}
.chips .sp{flex:1}.chips select,.chips input{width:auto;min-width:160px;padding:7px 11px}
.row{display:grid;grid-template-columns:92px 1fr auto;gap:14px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line-2);cursor:pointer}
.row:last-child{border-bottom:0}.row:hover{background:#FAFBFE}.row .t{font-weight:600;margin-bottom:3px}.row .m{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--ink-3)}
.reg{font-weight:700;font-size:12px;color:var(--brand);background:var(--brand-50);border-radius:8px;padding:5px 8px;text-align:center}
/* drawer + modal */
.veil{position:fixed;inset:0;background:rgba(15,28,55,.38);display:none;z-index:20;backdrop-filter:blur(1px)}.veil.on{display:block}
.drawer{position:fixed;top:0;right:0;height:100vh;width:min(520px,100vw);background:#fff;box-shadow:var(--sh-lg);z-index:21;transform:translateX(105%);transition:transform .22s ease;display:flex;flex-direction:column}
.drawer.on{transform:none}.dh{padding:20px 24px 14px;border-bottom:1px solid var(--line)}.dh h3{margin:8px 0 6px;font-size:17px;line-height:1.35}.db{padding:20px 24px;overflow-y:auto;flex:1}.df{padding:14px 24px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;background:#FAFBFD}
.kv{display:grid;grid-template-columns:112px 1fr;gap:6px 12px;font-size:13px;margin-bottom:18px}.kv dt{color:var(--ink-3)}.kv dd{margin:0}
.box{border-radius:10px;padding:12px 14px;margin:0 0 16px;font-size:13px}.box.ai{background:var(--brand-50);border:1px solid var(--brand-100)}.box.warn{background:var(--warn-50);border:1px solid #F0DDB0}.box.ok{background:var(--ok-50);border:1px solid #BFE3CF}
.box h4{margin:0 0 4px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-2)}
.opt{display:flex;gap:12px;padding:11px 14px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;cursor:pointer;align-items:flex-start}
.opt:hover{border-color:#B9C8E4}.opt input{width:auto;margin-top:3px;accent-color:var(--brand)}.opt b{display:block;font-size:13.5px}.opt span{font-size:12.5px;color:var(--ink-3)}
.opt:has(input:checked){border-color:var(--brand);background:var(--brand-50)}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-48%);width:min(620px,94vw);max-height:92vh;overflow:auto;background:#fff;border-radius:16px;box-shadow:var(--sh-lg);z-index:22;display:none}
.modal.on{display:block}.modal .mh{padding:20px 24px 4px}.modal h3{margin:0;font-size:17px}.modal .mb{padding:14px 24px;display:grid;gap:14px}.modal .mf{padding:14px 24px 20px;display:flex;gap:10px;justify-content:flex-end;align-items:center}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.sw{display:flex;gap:10px;align-items:flex-start}.sw input{width:auto;margin-top:3px;accent-color:var(--brand)}
.testout{font-size:12.5px;border:1px dashed var(--line);border-radius:8px;padding:10px 12px;background:#FAFBFD}.testout ul{margin:6px 0 0;padding-left:18px}
/* email preview */
.mail{display:grid;grid-template-columns:260px 1fr;gap:18px;align-items:start}
.rlist button{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:10px;padding:11px 14px;margin-bottom:8px}
.rlist button.on{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-100)}.rlist b{display:block;font-size:13.5px}
.mailhead{padding:16px 22px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:70px 1fr;gap:4px 8px;font-size:13px}.mailhead dt{color:var(--ink-3)}.mailhead dd{margin:0}
.mailbody{width:100%;height:440px;border:0;display:block;background:#fff}.mailfoot{padding:16px 22px;border-top:1px solid var(--line);background:#FAFBFD;border-radius:0 0 var(--r) var(--r)}
.toasts{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:40;align-items:center}
.toast{background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;box-shadow:var(--sh-lg);max-width:80vw}.toast.bad{background:var(--bad)}
#viewer{position:fixed;inset:4% 6%;background:#fff;border-radius:14px;box-shadow:var(--sh-lg);display:none;flex-direction:column;z-index:30;overflow:hidden}#viewer.on{display:flex}
#viewer header{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line)}#viewer iframe{flex:1;border:0}
@media(max-width:900px){body{flex-direction:column}aside{width:100%;height:auto;position:static;padding:12px}.side-note{display:none}nav{flex-direction:row;overflow-x:auto}.brand{padding-bottom:10px}
 main{padding:18px 16px}.top{padding:14px 16px}.mail{grid-template-columns:1fr}.row{grid-template-columns:1fr}.g2{grid-template-columns:1fr}}
</style></head><body>
<aside>
  <div class="brand"><div class="logo">TVS</div><div><b>Compliance Portal</b><span>Regulatory Monitoring</span></div></div>
  <nav id="nav" aria-label="Main"></nav>
  <div class="side-note">Automation identifies and drafts. Compliance makes every decision on applicability and wording.</div>
</aside>
<div class="wrap">
  <div class="top"><div><h1 id="ttl"></h1><p id="sub"></p></div><div class="grow"></div><div id="actions"></div></div>
  <main id="m" tabindex="-1"></main>
</div>
<div class="veil" id="veil"></div>
<div class="drawer" id="drawer" role="dialog" aria-label="Screening decision"></div>
<div class="modal" id="modal" role="dialog" aria-modal="true"></div>
<div id="viewer"><header><b>Document viewer</b><button class="btn sm" onclick="closeViewer()">Close</button></header><iframe id="fr" title="Document"></iframe></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<script>
const $=s=>document.querySelector(s);
const E=s=>(s??"").toString().replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const USER="compliance_user";
async function api(p,o={}){
  const isForm=o.body instanceof FormData;
  const r=await fetch("/api/"+p,{...o,headers:{...(isForm?{}:{"Content-Type":"application/json"}),"X-User":USER,...(o.headers||{})}});
  const ct=r.headers.get("content-type")||""; const d=ct.includes("json")?await r.json():await r.text();
  if(!r.ok) throw new Error(d.detail||d||"Something went wrong"); return d;
}
function toast(msg,bad){const t=document.createElement("div");t.className="toast"+(bad?" bad":"");t.textContent=msg;$("#toasts").append(t);setTimeout(()=>t.remove(),bad?6000:3200)}
const guard=fn=>async(...a)=>{try{return await fn(...a)}catch(e){toast(e.message,true)}};
const ICON={
 over:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>',
 upd:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5h16M4 12h16M4 19h10"/></svg>',
 mail:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m4 7 8 6 8-6"/></svg>',
 src:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg>',
 crawl:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 12a8 8 0 0 1 14-5l2 2M20 12a8 8 0 0 1-14 5l-2-2M20 4v5h-5M4 20v-5h5"/></svg>',
 exc:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3 2 20h20L12 3Zm0 7v5m0 3v.01"/></svg>',
 aud:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M7 3h8l4 4v14H7z"/><path d="M15 3v4h4M10 12h6M10 16h6"/></svg>'};
const PAGES={over:["Overview","Crawl status across all regulatory sources"],upd:["Updates","New and changed circulars awaiting Compliance screening"],
 mail:["Daily update","Preview and approve the morning and evening regulatory email"],src:["Source register","Websites and pages being monitored"],
 crawl:["Crawl history","Every crawl run, with outcome"],exc:["Exceptions","Problems that need a person"],aud:["Audit trail","Who did what, and when"]};
let cur="over", S={}, F={view:"pending",reg:"",q:""}, timer=null;
function renderNav(){ $("#nav").innerHTML=Object.keys(PAGES).map(k=>`<button data-k="${k}" class="${k==cur?"on":""}">${ICON[k]}${PAGES[k][0]}${badge(k)}</button>`).join("") }
const badge=k=>{const n=k=="upd"?S.pending:k=="exc"?S.open_exceptions:k=="mail"?S.reports_awaiting:0;return n?`<span class="n">${n}</span>`:""};
$("#nav").onclick=e=>{const b=e.target.closest("button");if(b){cur=b.dataset.k;go()}};
const fdt=s=>{if(!s)return "-";const d=new Date(s);return isNaN(d)?E(s):d.toLocaleString("en-IN",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit",hour12:false})};
const fday=s=>{if(!s)return "-";const d=new Date(s);return isNaN(d)?E(s):d.toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"numeric"})};
const CT={new:["New","brand"],modified:["Modified","warn"],"backdated/inserted":["Backdated / inserted","bad"],baseline:["Existing item",""]};
const ctPill=t=>{const [l,c]=CT[t]||[t,""];return `<span class="pill ${c}">${E(l)}</span>`};
const DEC={implementation_required:["Implementation required","Action is needed. This moves on to the implementation tracker."],
 potential_future:["Future relevance","Not applicable today, but may become relevant. Keep on watch."],
 other_function:["Other department","Relevant to another function. Forward for their action."],
 information_only:["Information only","Noted for awareness. No action required."],
 not_nbfc_relevant:["Not NBFC relevant","Does not apply to us. A remark is required."]};
const decPill=s=>s=="pending"?`<span class="pill warn">Pending review</span>`:s=="n/a"?"":`<span class="pill ok">${E((DEC[s]||[s])[0])}</span>`;

async function go(){
  clearInterval(timer); S=await api("summary").catch(()=>S); renderNav();
  $("#ttl").textContent=PAGES[cur][0]; $("#sub").textContent=PAGES[cur][1]; $("#actions").innerHTML="";
  try{ await PAGE[cur]() }catch(e){ $("#m").innerHTML=`<div class="card empty"><b>Could not load this page</b>${E(e.message)}</div>` }
}

/* ============================== OVERVIEW ============================== */
const PAGE={};
PAGE.over=async()=>{
  const [src,exc]=await Promise.all([api("sources"),api("exceptions")]);
  $("#actions").innerHTML=`<button class="btn pri" onclick="runCrawl()">Run crawl now</button>`;
  const open=exc.filter(e=>!e.resolved).slice(0,5);
  $("#m").innerHTML=`
  <div class="stats">
   <div class="card stat"><div class="lab">Sources monitored</div><div class="val">${S.sources_ok}<small> / ${S.sources}</small></div><div class="sub">${S.sources-S.sources_ok?`${S.sources-S.sources_ok} need attention`:"All healthy"}</div></div>
   <div class="card stat"><div class="lab">New updates</div><div class="val">${S.new_today}</div><div class="sub">today &middot; ${S.new_week} this week</div></div>
   <div class="card stat"><div class="lab">Last successful crawl</div><div class="val" style="font-size:22px;padding:6px 0">${fdt(S.last_crawl)}</div><div class="sub">${S.next_run?"Next scheduled: "+fdt(S.next_run):"Scheduler not running"}</div></div>
   <div class="card stat ${S.pending?"warn":""}"><div class="lab">Pending review</div><div class="val">${S.pending}</div><div class="sub">${S.pending_relevant} flagged potentially NBFC-relevant</div></div>
  </div>
  <div class="sec"><h2>Source status</h2><span class="grow"></span><button class="btn sm" onclick="nav('src')">Manage sources</button></div>
  <div class="srcgrid">${src.filter(s=>s.active).map(s=>{const bad=s.status=="exception",nc=s.status=="not crawled";
    return `<div class="card src"><span class="dot ${bad?"bad":nc?"":"ok"}"></span><div style="min-width:0"><b>${E(s.regulator)} <span class="muted" style="font-weight:500">&middot; ${E(s.name)}</span></b>
      <span class="sm muted">${nc?"Not yet crawled":s.last_success?"Last success "+fdt(s.last_success):"No successful crawl yet"} &middot; ${s.n_updates} update${s.n_updates==1?"":"s"}</span>
      ${bad&&s.last_error?`<div class="err">${E(friendly(s.last_error))}</div>`:""}</div></div>`}).join("")||`<div class="card empty"><b>No sources yet</b>Add the pages to monitor in the Source register.<div style="margin-top:12px"><button class="btn pri" onclick="nav('src')">Go to Source register</button></div></div>`}</div>
  ${S.sources-S.sources_ok?`<p class="sm muted" style="margin-top:12px">A source that failed is <b>not</b> covered by a &ldquo;no update&rdquo; statement. The daily email says so.</p>`:""}
  ${open.length?`<div class="sec" style="margin-top:26px"><h2>Needs attention</h2><span class="grow"></span><button class="btn sm" onclick="nav('exc')">View all</button></div>
   <div class="card scroll"><table class="tbl"><tbody>${open.map(e=>`<tr><td><b>${E(e.sname||"System")}</b></td><td class="sm">${E(friendly(e.message))}</td><td class="muted sm">${fdt(e.ts)}</td></tr>`).join("")}</tbody></table></div>`:""}`;
  if(Date.now()<crawlUntil) timer=setInterval(()=>go(),8000);
};
const cap=t=>t.charAt(0).toUpperCase()+t.slice(1);
const friendly=m=>{m=m||"";
  if(/Executable doesn't exist/.test(m))return "Browser component is not installed on this machine.";
  if(/404/.test(m))return "Page address not found (404). The URL may have changed.";
  if(/No links found/.test(m))return "No links found. The page may be blocking automated access or has changed layout.";
  if(/Timeout/.test(m))return "The site took too long to respond.";
  if(/CONNECTION_RESET|RESET/.test(m))return "The site closed the connection. It may be blocking automated access.";
  if(/bot-check/.test(m))return m.replace(/^.*?:\s*/,"").replace(/^\S.*?\):\s*/,"")||m;
  return m.split("\n")[0].slice(0,160)};
let crawlUntil=0;
const runCrawl=guard(async id=>{await api("crawl/run"+(id?"?source_id="+id:""),{method:"POST"});crawlUntil=Date.now()+180000;toast("Crawl started. Results appear here as each source finishes.");setTimeout(go,1500)});
const nav=k=>{cur=k;go()};
const captureSrc=guard(async id=>{await api("capture?limit=10"+(id?"&source_id="+id:""),{method:"POST"});toast("Reading the latest 10 existing items"+(id?"":" of every source")+". This takes a minute or two. Check Updates > Existing items.")});

/* ============================== UPDATES ============================== */
let ITEMS=[];
const todayStr=()=>new Date().toLocaleDateString("en-CA"), weekStr=()=>new Date(Date.now()-6*864e5).toLocaleDateString("en-CA");
const VIEWS={today:["Today",i=>(i.detected_at||"").slice(0,10)==todayStr()],week:["This week",i=>(i.detected_at||"").slice(0,10)>=weekStr()],
 rel:["NBFC relevant",i=>i.nbfc_flag=="potentially relevant"],pending:["Pending review",i=>i.review_status=="pending"],all:["All updates",()=>true],existing:["Existing items",()=>true]};

  $("#chips").innerHTML=Object.entries(VIEWS).map(([k,[l,f]])=>`<button class="chip ${F.view==k?"on":""}" data-v="${k}">${l}${k=="existing"?"":`<span class="c">${ITEMS.filter(f).length}</span>`}</button>`).join("")+
   `<span class="sp"></span><select id="freg" aria-label="Regulator"><option value="">All regulators</option>${regs.map(r=>`<option ${F.reg==r?"selected":""}>${E(r)}</option>`).join("")}</select>
    <input id="fq" type="search" placeholder="Search title" value="${E(F.q)}" aria-label="Search">`;

function drawList(redrawChips){

  const rows=(F.view=="existing"?EXISTING:ITEMS.filter(VIEWS[F.view][1])).filter(i=>!F.reg||i.regulator==F.reg).filter(i=>F.view=="existing"||!F.q||i.title.toLowerCase().includes(F.q.toLowerCase()));
  $("#list").innerHTML=rows.length?rows.map(i=>`<div class="row" tabindex="0" data-id="${i.id}" role="button">
    <div class="reg">${E(i.regulator)}</div>

      ${i.change_type=="baseline"?(i.n_paras?`<span class="pill ok">${i.n_paras} paragraphs captured</span>`:`<span class="pill">Content not read yet</span>`):""}
      <span>${i.shown_date?"Dated "+fday(i.shown_date)+" &middot; ":""}Found ${fdt(i.detected_at)}</span></div></div>
    <div>${decPill(i.review_status)}</div></div>`).join(""):
   `<div class="empty"><b>${F.view=="existing"?"No existing items found":ITEMS.length?"Nothing matches these filters":"No new updates yet"}</b>${F.view=="existing"?"Existing items are the pages already on the website when monitoring started.":ITEMS.length?"Try another view.":"New and changed items appear here from the second crawl onward. To read pages that were already on the website, open <b>Existing items</b>."}</div>`;

const WHYUI={copy_blocked:"The website blocked the automated download of this PDF, but the page text was captured. Upload the PDF only if you need the original.",blocked:"The website showed a bot-check page instead of the content. Download the file yourself and upload it here.",no_text:"Scanned image with no readable text. Upload a text version, or handle it manually.",unsupported:"Old Word/Excel or archive file. Saved, but not read. Open it manually, or upload a .docx / .xlsx version.",unreadable:"The file could not be read."};

     ${x.status=="ok"?`<span class="pill ok">${x.n_paras} paragraphs</span>`:x.status=="copy_blocked"?`<span class="pill warn">PDF copy blocked</span>`:`<span class="pill bad">Needs attention</span>`}</div>

       ${x.status=="ok"?`<button class="btn sm" onclick="showParas(${id},${x.id})">Preview text</button>`:""}</div></div>`).join("")}
   ${bad.length?`<div style="margin-top:10px"><label class="btn sm" style="display:inline-block">Upload a file<input type="file" accept=".pdf,.docx,.xlsx" hidden onchange="uploadDoc(${id},this.files[0])"></label></div>`:""}

const showParas=guard(async(id,did)=>{const r=await api(`items/${id}/paragraphs?document_id=${did}`);$("#paras").innerHTML=`<div style="max-height:240px;overflow:auto;margin-top:10px;background:#fff;border:1px solid var(--line);border-radius:8px">${r.paragraphs.slice(0,60).map(p=>`<div style="padding:8px 10px;border-bottom:1px solid var(--line-2)"><span class="pill brand">${E(p.trace)}</span><div class="sm" style="margin-top:4px">${E(p.text.slice(0,260))}${p.text.length>260?"&hellip;":""}</div></div>`).join("")}${r.paragraphs.length>60?`<div class="sm muted" style="padding:8px 10px">Showing 60 of ${r.paragraphs.length}. The full text is in the Excel report.</div>`:""}</div>`});
const uploadDoc=guard(async(id,f)=>{if(!f)return;const fd=new FormData();fd.append("f",f);const r=await api(`items/${id}/upload`,{method:"POST",body:fd});

const testSrc=async()=>{const b=srcBody();if(!b.url)return toast("Enter the page address first",true);$("#tout").innerHTML=`<div class="testout">Checking the page&hellip;</div>`;

/* ---- Bulk add: paste lines or upload CSV, check, then import ---- */
let BULK=[];
async function bulkSrc(){
  const regs=await api("regulators").catch(()=>[]);
  $("#modal").innerHTML=`<div class="mh"><h3>Bulk add sources</h3></div><div class="mb">
   <div class="g2"><div><label for="b1">Regulator for all rows below</label><input id="b1" list="regs" placeholder="e.g. RBI"><datalist id="regs">${regs.map(r=>`<option value="${E(r)}">`).join("")}</datalist>

    <div><label>Or upload a CSV file</label><label class="btn" style="display:block;text-align:center;margin:0">Choose file<input type="file" accept=".csv,text/csv" hidden onchange="bulkFile(this.files[0])"></label>
     <div class="hint"><a href="#" onclick="bulkTemplate();return false">Download template</a> (columns: regulator, name, url, browser)</div></div></div>
   <div><label for="b2">Page addresses, one per line</label><textarea id="b2" style="min-height:150px;font:12.5px/1.5 Consolas,monospace" placeholder="https://www.rbi.org.in/Scripts/NotificationUser.aspx&#10;RBI Circulars | https://www.rbi.org.in/Scripts/BS_CircularIndexDisplay.aspx&#10;TRAI | TRAI Regulations | https://www.trai.gov.in/..." oninput="BULK=[];$('#bout').innerHTML=''"></textarea>
     <div class="hint">Each line can be: <b>URL</b> &nbsp;or&nbsp; <b>Page name | URL</b> &nbsp;or&nbsp; <b>Regulator | Page name | URL</b>, optionally followed by <b>| yes</b> for browser mode. Pasting from Excel works too.</div></div>
   <label class="sw"><input type="checkbox" id="b3"><span><b>Use browser mode for these pages</b><div class="hint">Only for pages that build themselves with JavaScript. Slower. Can be changed per source later.</div></span></label>
   <div id="bout"></div></div>
   <div class="mf"><button class="btn" onclick="bulkCheck()" style="margin-right:auto">Check</button><button class="btn" onclick="closeDrawer()">Cancel</button><button class="btn pri" id="bgo" onclick="bulkGo()">Import</button></div>`;
  $("#veil").classList.add("on");$("#modal").classList.add("on");
}
function bulkParse(){
  const def=$("#b1").value.trim(); const rows=[];
  $("#b2").value.split(/\r?\n/).map(l=>l.trim()).filter(Boolean).forEach(l=>{
    const parts=l.split(/\s*[|	]\s*/).map(x=>x.trim()); let ui=parts.findIndex(x=>/^https?:\/\//i.test(x)); if(ui<0)ui=parts.length-1;
    const url=parts[ui]||"", pre=parts.slice(0,ui), after=parts.slice(ui+1).find(x=>x!=="")||""; let reg=def,name="";      // keep blank cells so columns stay in place
    if(pre.length>=2){reg=pre[0]||def;name=pre[1]} else if(pre.length==1){name=pre[0]}
    const row={regulator:reg,name,url}; if(/^(yes|y|1|true|browser)$/i.test(after))row.render_js=1; else if(/^(no|n|0|false|standard)$/i.test(after))row.render_js=0; rows.push(row);
  }); return rows;
}
function bulkCheck(){
  BULK=bulkParse(); const seen=new Set();
  if(!BULK.length){$("#bout").innerHTML=`<div class="testout" style="color:var(--bad);border-color:var(--bad)">Add at least one address first.</div>`;return false}
  const bad=BULK.map(r=>{const k=r.url.toLowerCase().replace(/#.*$/,"").replace(/\/$/,"");
    if(!/^https?:\/\/[^\s\/]+\S*$/i.test(r.url))return "Not a valid web address";if(!r.regulator)return "Regulator missing";if(seen.has(k))return "Repeated in this list";seen.add(k);return ""});
  const ok=bad.filter(x=>!x).length;
  $("#bout").innerHTML=`<div class="testout"><b style="color:${ok?"var(--ok)":"var(--bad)"}">${ok} of ${BULK.length} row(s) ready to import.</b>${ok<BULK.length?" The rest will be skipped:":""}
   <div style="max-height:190px;overflow:auto;margin-top:8px"><table class="tbl" style="font-size:12.5px"><tbody>${BULK.map((r,i)=>`<tr><td style="padding:6px 8px"><b>${E(r.regulator||"?")}</b></td><td style="padding:6px 8px">${E(r.name)||'<span class="muted">(name from address)</span>'}</td><td style="padding:6px 8px;max-width:220px" class="clip">${E(r.url)}</td>
    <td style="padding:6px 8px;white-space:nowrap">${bad[i]?`<span class="pill bad">${E(bad[i])}</span>`:`<span class="pill ok">Ready</span>`}</td></tr>`).join("")}</tbody></table></div></div>`;
  return ok>0;
}
const bulkGo=guard(async()=>{
  if(!bulkCheck())return; const r=await api("sources/bulk",{method:"POST",body:JSON.stringify({rows:BULK,render_js:$("#b3").checked?1:0})});
  const skipped=r.results.filter(x=>x.status!="added");
  $("#bout").innerHTML=`<div class="testout"><b style="color:var(--ok)">${r.added} source(s) added.</b>${skipped.length?` ${skipped.length} skipped:<ul>${skipped.map(x=>`<li>Row ${x.row}: ${E(x.message)}</li>`).join("")}</ul>`:""}</div>`;
  $("#bgo").style.display="none"; toast(`${r.added} source(s) added`); go();
});
const bulkFile=f=>{if(!f)return;const rd=new FileReader();rd.onload=()=>{
  const rows=[];let row=[],cell="",q=false,t=String(rd.result).replace(/^\uFEFF/,"");
  for(let i=0;i<t.length;i++){const ch=t[i];
    if(q){if(ch=='"'&&t[i+1]=='"'){cell+='"';i++}else if(ch=='"')q=false;else cell+=ch}
    else if(ch=='"')q=true;else if(ch==","){row.push(cell);cell=""}else if(ch=="\n"){row.push(cell);rows.push(row);row=[];cell=""}else if(ch!="\r")cell+=ch}
  if(cell||row.length){row.push(cell);rows.push(row)}
  const head=(rows[0]||[]).map(x=>x.trim().toLowerCase()), hasHead=head.includes("url"), ix=n=>head.indexOf(n);
  const body=(hasHead?rows.slice(1):rows).filter(r=>r.some(x=>x.trim()));
  $("#b2").value=body.map(r=>hasHead?[r[ix("regulator")]||"",r[ix("name")]||"",r[ix("url")]||"",ix("browser")>=0?(r[ix("browser")]||""):""].map(x=>x.trim()).join(" | "):r.map(x=>x.trim()).join(" | ")).join("\n");
  toast(`${body.length} row(s) loaded from ${f.name}. Review them, then click Check.`);BULK=[];$("#bout").innerHTML=""};rd.readAsText(f)};
const bulkTemplate=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["regulator,name,url\nRBI,RBI Circulars,https://www.rbi.org.in/Scripts/BS_CircularIndexDisplay.aspx\nTRAI,TRAI Regulations,https://www.trai.gov.in/\n"],{type:"text/csv"}));a.download="sources_template.csv";a.click()};

/* ============================== DAILY UPDATE (email preview + approval) ============================== */
let RPT=[],selR=null;
PAGE.mail=async()=>{
  RPT=await api("reports"); if(!selR||!RPT.find(r=>r.name==selR))selR=RPT[0]?.name;
  $("#actions").innerHTML=`<button class="btn" onclick="genR('morning')">Create morning draft</button> <button class="btn" onclick="genR('evening')">Create evening draft</button>`;
  if(!RPT.length){$("#m").innerHTML=`<div class="card empty"><b>No daily updates yet</b>Drafts are created automatically after the 09:00 and 18:00 crawls, or create one now.</div>`;return}
  $("#m").innerHTML=`<div class="mail"><div class="rlist" id="rl">${RPT.map(r=>`<button data-n="${E(r.name)}" class="${r.name==selR?"on":""}"><b>${fday(r.day)} &middot; ${r.cycle=="morning"?"Morning":"Evening"}</b>
     <span class="pill ${r.status=="approved"?"ok":"warn"}" style="margin-top:4px">${r.status=="approved"?"Approved":"Awaiting approval"}</span></button>`).join("")}</div><div id="prev"></div></div>`;
  $("#rl").onclick=e=>{const b=e.target.closest("button");if(b){selR=b.dataset.n;PAGE.mail()}};
  const r=RPT.find(x=>x.name==selR), html=await api("report/"+encodeURIComponent(r.name)), cyc=r.cycle=="morning"?"Morning":"Evening";
  $("#prev").innerHTML=`<div class="card"><dl class="mailhead"><dt>Subject</dt><dd><b>Regulatory Update &ndash; ${fday(r.day)} (${cyc})</b></dd><dt>To</dt><dd class="muted">Distribution list &ndash; to be configured</dd><dt>Status</dt>
    <dd>${r.status=="approved"?`<span class="pill ok">Approved by ${E(r.approved_by)} on ${fdt(r.approved_at)}</span>`:`<span class="pill warn">Draft &ndash; not approved</span>`}</dd></dl>
    <iframe class="mailbody" sandbox title="Email preview" srcdoc="${E('<body style="margin:22px;font-family:Segoe UI,Arial">'+html)}"></iframe>
    <div class="mailfoot">${r.status=="approved"?`<span class="sm muted">${r.remarks?E(r.remarks)+" &middot; ":""}Approved reports are kept as a record and are not overwritten.</span> <button class="btn sm" style="float:right" onclick="reopenR('${E(r.name)}')">Reopen as draft</button>`:
     `<label for="arem">Approval note (optional)</label><input id="arem" placeholder="e.g. Checked all flagged items"><div style="display:flex;gap:10px;margin-top:12px;align-items:center"><span class="sm muted" style="flex:1">Email sending is not connected yet. Approval records Compliance&rsquo;s decision.</span>
       <button class="btn ok" onclick="approveR('${E(r.name)}')">Approve for release</button></div>`}</div></div>`;
};
const genR=guard(async c=>{await api("report/generate?cycle="+c,{method:"POST"});toast("Draft created");selR=null;go()});
const approveR=guard(async n=>{await api(`report/${encodeURIComponent(n)}/approve`,{method:"POST",body:JSON.stringify({remarks:$("#arem").value})});toast("Daily update approved");go()});
const reopenR=guard(async n=>{await api(`report/${encodeURIComponent(n)}/reopen`,{method:"POST"});go()});

/* ============================== CRAWL HISTORY, EXCEPTIONS, AUDIT ============================== */
const isoDay=d=>d.toLocaleDateString("en-CA");
PAGE.crawl=async()=>{const r=await api("crawls");
  $("#m").innerHTML=`<div class="card" style="padding:14px 18px;margin-bottom:16px;display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap">
    <div><label for="xf">From</label><input id="xf" type="date" style="width:auto" value="${isoDay(new Date(Date.now()-6*864e5))}"></div>
    <div><label for="xt">To</label><input id="xt" type="date" style="width:auto" value="${isoDay(new Date())}"></div>
    <div style="display:flex;gap:8px"><button class="btn pri" onclick="dl('xlsx')">Download Excel</button><button class="btn" onclick="dl('pdf')">Download PDF</button><button class="btn" onclick="saveRep()">Save Excel to reports folder</button></div>
    <div class="sm muted" style="flex:1;min-width:220px">The report includes crawl runs, source health, updates found with their Compliance decisions, and exceptions for the chosen dates.</div></div><div id="saved"></div><div id="ct"></div>`; loadSaved();
  $("#ct").innerHTML=r.length?`<div class="card scroll"><table class="tbl"><thead><tr><th>Started</th><th>Source</th><th>Run</th><th>Result</th><th>Links seen</th><th>New / changed</th></tr></thead><tbody>
  ${r.map(c=>`<tr><td class="sm">${fdt(c.started)}</td><td><b>${E(c.regulator)}</b> <span class="muted sm">${E(c.sname)}</span></td><td class="sm muted">${E(c.cycle)}</td>
   <td>${c.status=="ok"?`<span class="pill ok">Completed</span>`:c.status=="running"?`<span class="pill brand">Running</span>`:`<span class="pill bad" title="${E(c.error)}">Failed</span>`}</td><td>${c.n_items}</td><td>${c.n_new}</td></tr>`).join("")}</tbody></table></div>`:`<div class="card empty"><b>No crawls yet</b></div>`};
const fsz=n=>n>1048576?(n/1048576).toFixed(1)+" MB":Math.max(1,Math.round(n/1024))+" KB";
async function loadSaved(){const r=await api("saved-reports").catch(()=>null);if(!r)return;
  $("#saved").innerHTML=`<div class="sec"><h2>Saved reports</h2><span class="sm muted">Stored in <b>${E(r.folder)}</b>. An Excel report is saved automatically after each 09:00 and 18:00 crawl.</span></div>
   <div class="card scroll" style="margin-bottom:22px">${r.reports.length?`<table class="tbl"><thead><tr><th>Report</th><th>Period</th><th>Saved</th><th>Runs</th><th>Updates</th><th>Size</th><th></th></tr></thead><tbody>
   ${r.reports.map(x=>`<tr><td class="sm"><b>${E(x.name)}</b></td><td class="sm">${E(x.period_from)}${x.period_to!=x.period_from?" to "+E(x.period_to):""}</td><td class="sm">${fdt(x.created_at)} &middot; ${E(x.created_by)}</td><td>${x.n_runs}</td><td>${x.n_updates}</td><td class="sm muted">${fsz(x.size)}</td>
   <td style="text-align:right"><a class="btn sm" href="/api/saved-reports/${encodeURIComponent(x.name)}">Download</a></td></tr>`).join("")}</tbody></table>`:`<div class="empty" style="padding:22px">No saved reports yet. Use &ldquo;Save Excel to reports folder&rdquo;, or wait for the next scheduled crawl.</div>`}</div>`}
const saveRep=guard(async()=>{const a=$("#xf").value,b=$("#xt").value;if(!a||!b)return toast("Choose both dates",true);if(a>b)return toast("The start date is after the end date",true);
  const r=await api("export/crawl/save?date_from="+a+"&date_to="+b,{method:"POST"});toast("Saved as "+r.name);loadSaved()});
const dl=(f)=>{const a=$("#xf").value,b=$("#xt").value;if(!a||!b)return toast("Choose both dates",true);if(a>b)return toast("The start date is after the end date",true);
  window.location="/api/export/crawl?format="+f+"&date_from="+a+"&date_to="+b;toast("Preparing your "+(f=="pdf"?"PDF":"Excel")+" report")};
PAGE.exc=async()=>{const r=await api("exceptions");$("#m").innerHTML=r.length?`<div class="card scroll"><table class="tbl"><thead><tr><th>When</th><th>Source</th><th>Problem</th><th>Where</th><th></th></tr></thead><tbody>
  ${r.map(e=>`<tr style="${e.resolved?"opacity:.5":""}"><td class="sm">${fdt(e.ts)}</td><td><b class="sm">${E(e.sname||"System")}</b></td><td class="sm" style="max-width:460px">${E(friendly(e.message))}</td><td class="sm muted">${E(e.stage)}</td>
   <td style="text-align:right">${e.resolved?`<span class="pill ok">Resolved</span>`:`<button class="btn sm" onclick="resolveE(${e.id})">Mark resolved</button>`}</td></tr>`).join("")}</tbody></table></div>`:`<div class="card empty"><b>No exceptions</b>Everything is running normally.</div>`};
const resolveE=guard(async id=>{await api(`exceptions/${id}/resolve`,{method:"POST"});go()});
PAGE.aud=async()=>{const r=await api("audit");$("#m").innerHTML=`<div class="card scroll"><table class="tbl"><thead><tr><th>When</th><th>User</th><th>Action</th><th>Detail</th></tr></thead><tbody>
  ${r.map(a=>`<tr><td class="sm" style="white-space:nowrap">${fdt(a.ts)}</td><td class="sm">${E(a.actor)}</td><td><span class="pill">${E(a.action.replace(/_/g," "))}</span></td><td class="sm" style="max-width:520px">${E(a.detail)}</td></tr>`).join("")}</tbody></table></div>`};
go();
</script></body></html>
